<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Titans · визуальные концепты</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#b9b5d6;font-family:Rubik,system-ui,sans-serif}
canvas{width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff}
.badge{position:absolute;top:14px;display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:40px;background:rgba(32,30,58,.72);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.badge.l{left:16px}.badge.r{right:16px;flex-direction:row-reverse;padding:6px 6px 6px 14px}
.face{width:46px;height:46px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.teal{background:linear-gradient(#3fd0c2,#1b8f86)}.coral{background:linear-gradient(#ff8a6e,#c9452f)}
.who{font-size:12px;font-weight:700;letter-spacing:.06em;opacity:.85}.hearts{font-size:20px;letter-spacing:2px;color:#ff5a6a;text-shadow:0 2px 0 #7a1c2a}.hearts i{color:#5a5470;font-style:normal;text-shadow:none}
.lvl{font-size:11px;font-weight:700;color:#ffe08a}
#timer{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:rgba(32,30,58,.78);padding:6px 16px;border-radius:20px;font-weight:800;font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
#warn{position:absolute;top:58px;left:50%;transform:translateX(-50%);background:#f4b63c;color:#3a2600;padding:4px 12px;border-radius:12px;font-weight:700;font-size:12px}
.slots{position:absolute;right:20px;bottom:150px;display:flex;gap:6px}
.slot{width:34px;height:34px;border-radius:9px;background:rgba(32,30,58,.72);border:2px solid rgba(255,255,255,.35);display:grid;place-items:center}
.slot b{width:16px;height:16px;transform:rotate(45deg);border-radius:3px;background:linear-gradient(135deg,#d9fbff,#5fd3f2 55%,#2e8fc7);box-shadow:0 0 10px #7fe8ff}
.slot.e b{background:none;box-shadow:none}
#throw{position:absolute;right:26px;bottom:34px;width:96px;height:96px;border-radius:50%;background:radial-gradient(#ffb547,#e07a12);border:4px solid #fff3d2;box-shadow:0 5px 0 #8a4508;display:grid;place-items:center;font-weight:800;font-size:13px;color:#4a2300}
#throw .ring{position:absolute;inset:-10px;border-radius:50%;border:5px solid transparent;border-top-color:#7fe8ff;border-right-color:#7fe8ff;transform:rotate(-20deg)}
#stick{position:absolute;left:46px;bottom:40px;width:110px;height:110px;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12)}
#stick:after{content:"";position:absolute;left:30px;top:30px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.75)}
#repair{position:absolute;right:140px;bottom:44px;width:62px;height:62px;border-radius:50%;background:radial-gradient(#66d98a,#23944a);border:3px solid #eaffef;display:grid;place-items:center;font-size:11px;font-weight:800;color:#0b3a1a;box-shadow:0 4px 0 #0f5a2b}
#tag{position:absolute;left:50%;top:92px;transform:translateX(-50%);background:rgba(32,30,58,.6);padding:3px 10px;border-radius:10px;font-size:11px;font-weight:700}
#lobby{position:absolute;inset:0}
#logo{position:absolute;left:28px;top:20px;font-weight:800;font-size:40px;line-height:.9;color:#fff2c4;text-shadow:0 3px 0 #b05a12,0 6px 0 #5a2a06,0 0 24px rgba(255,190,90,.6);letter-spacing:.02em}
#logo small{display:block;font-size:14px;letter-spacing:.3em;color:#bff4ff;text-shadow:0 2px 0 #1d5a78}
.res{position:absolute;top:22px;right:24px;display:flex;gap:10px}
.res span{background:rgba(32,30,58,.75);padding:6px 14px;border-radius:16px;font-weight:700}
.menu{position:absolute;left:28px;bottom:28px;display:flex;gap:10px}
.menu span{background:rgba(32,30,58,.8);border:2px solid rgba(255,255,255,.3);padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px}
#fight{position:absolute;right:28px;bottom:28px;padding:20px 46px;border-radius:20px;background:linear-gradient(#ffcf5a,#f08a1c);border:4px solid #fff3d2;color:#4a2300;font-weight:800;font-size:28px;box-shadow:0 6px 0 #8a4508}
#fight small{display:block;font-size:12px;font-weight:700;text-align:center}
.league{position:absolute;left:28px;top:118px;background:rgba(32,30,58,.75);padding:8px 14px;border-radius:14px;font-weight:700;font-size:13px}
.league b{color:#bff4ff}
</style></head>
<body><canvas id="c"></canvas><div id="hud"></div><script type="module" src="./scene.ts"></script></body></html>
