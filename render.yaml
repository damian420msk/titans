# Render Blueprint: online duel server (WebSocket). Dashboard: New -> Blueprint -> pick this repo.
services:
  - type: web
    name: titans-server
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
