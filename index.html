<!doctype html>
<html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Титаны</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/client/play/hud.css">
</head><body>
<canvas id="game"></canvas>
<div id="hud" hidden>
  <div class="badge l"><div class="face teal">ВЫ</div><div><div class="who">ВЫ</div><div class="hearts" id="hearts0"></div></div></div>
  <div class="badge r"><div class="face coral">ИИ</div><div><div class="who" id="foe-name">БОРГАР</div><div class="hearts" id="hearts1"></div></div></div>
  <div id="timer">3:00</div>
  <div id="tools"><button id="pause-btn" aria-label="Пауза">❚❚</button><button id="mute-btn" aria-label="Звук">🔊</button><button id="fs-btn" aria-label="Полный экран">⛶</button></div>
  <div id="toast"></div>
  <div id="charge"><i></i><span></span></div>
  <div id="slots"></div>
  <div id="stick"><i></i></div>
  <button id="repair" hidden>РЕМОНТ</button>
  <div id="cancel" hidden>✕</div>
  <div id="hint"></div>
</div>
<div id="menu" class="overlay">
  <div class="panel">
    <h1>ТИТАНЫ<small>БРОСКИ С НЕБЕСНЫХ ОСТРОВОВ</small></h1>
    <p>Бросай небесные камни по острову врага. Разбей плиты под титаном, чтобы он упал.</p>
    <div class="levels">
      <button data-level="easy">Лёгкий</button><button data-level="normal" class="sel">Средний</button><button data-level="hard">Сложный</button>
    </div>
    <button id="start" class="big">В БОЙ</button>
    <div class="help" id="help"></div>
  </div>
</div>
<div id="end" class="overlay" hidden><div class="panel"><h1 id="end-title"></h1><p id="end-text"></p><button id="again" class="big">ЕЩЁ РАЗ</button><button id="to-menu">Меню</button></div></div>
<div id="pause" class="overlay" hidden><div class="panel"><h1>ПАУЗА</h1><button id="resume" class="big">ПРОДОЛЖИТЬ</button><button id="pause-menu">Выйти в меню</button></div></div>
<div id="portrait" class="overlay" hidden><div class="panel"><h1>Поверните телефон</h1><p>Игра идёт в горизонтальном режиме. Бой на паузе.</p></div></div>
<div id="loading" class="overlay"><div class="panel"><h1>Загрузка…</h1></div></div>
<script type="module" src="/client/play/main.ts"></script>
</body></html>
